; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.partitions = max_app_4MB.csv
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_dtr = 0
lib_deps = 
	adafruit/Adafruit_VL53L0X@^1.2.5
	gin66/FastAccelStepper@^1.2.5
	fastled/FastLED@^3.10.3
	https://github.com/micro-ROS/micro_ros_platformio
	janelia-arduino/TMC2209@^10.1.1
board_microros_distro = jazzy
board_microros_transport = wifi
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DENV_WIFI_SSID='"'${sysenv.PAMI_WIFI_SSID}'"'
	-DENV_WIFI_PASSWORD='"'${sysenv.PAMI_WIFI_PASSWORD}'"'
	-DENV_AGENT_IP='"'${sysenv.PAMI_AGENT_IP}'"'
	-DENV_NAMESPACE='"'${sysenv.PAMI_NAMESPACE}'"'
	-DENV_REV=${sysenv.PAMI_REV}
